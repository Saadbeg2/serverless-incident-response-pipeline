AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Incident Response Pipeline Phase 2 backend infrastructure.

Parameters:
  IncidentAlertTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for HIGH/CRITICAL alarm incident alerts.

Conditions:
  HasIncidentAlertTopicArn: !Not [!Equals [!Ref IncidentAlertTopicArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        INCIDENTS_TABLE_NAME: !Ref IncidentsTable

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sirp-incidents-sam-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: ServerlessIncidentResponsePipeline

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-create-incident-sam-dev
      Handler: create_incident.handler
      CodeUri: src/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt IncidentsTable.Arn

  GetIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-get-incident-sam-dev
      Handler: get_incident.handler
      CodeUri: src/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt IncidentsTable.Arn

  ListIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-list-incidents-sam-dev
      Handler: list_incidents.handler
      CodeUri: src/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt IncidentsTable.Arn

  UpdateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-update-incident-sam-dev
      Handler: update_incident.handler
      CodeUri: src/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

  AlarmToIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-alarm-to-incident-sam-dev
      Handler: alarm_to_incident.handler
      CodeUri: src/
      Environment:
        Variables:
          INCIDENTS_TABLE_NAME: !Ref IncidentsTable
          INCIDENT_ALERT_TOPIC_ARN: !Ref IncidentAlertTopicArn
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt IncidentsTable.Arn
        - !If
          - HasIncidentAlertTopicArn
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref IncidentAlertTopicArn
          - !Ref AWS::NoValue

  EscalateIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-escalate-incidents-sam-dev
      Handler: escalate_incidents.handler
      CodeUri: src/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

  FailureSimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sirp-failure-simulator-sam-dev
      Handler: failure_simulator.handler
      CodeUri: src/
      MemorySize: 128
      Timeout: 5

  FailureSimulatorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sirp-failure-simulator-errors-sam-dev
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: sirp-failure-simulator-sam-dev
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FailureSimulatorAlarmStateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sirp-failure-simulator-alarm-rule-sam-dev
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          alarmName:
            - sirp-failure-simulator-errors-sam-dev
          state:
            value:
              - ALARM
      State: ENABLED
      Targets:
        - Arn: !GetAtt AlarmToIncidentFunction.Arn
          Id: AlarmToIncidentFunctionTarget

  AllowEventBridgeInvokeAlarmToIncident:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AlarmToIncidentFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailureSimulatorAlarmStateRule.Arn

  CreateIncidentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-create-incident-sam-dev
      RetentionInDays: 7

  GetIncidentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-get-incident-sam-dev
      RetentionInDays: 7

  ListIncidentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-list-incidents-sam-dev
      RetentionInDays: 7

  UpdateIncidentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-update-incident-sam-dev
      RetentionInDays: 7

  AlarmToIncidentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-alarm-to-incident-sam-dev
      RetentionInDays: 7

  EscalateIncidentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-escalate-incidents-sam-dev
      RetentionInDays: 7

  FailureSimulatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sirp-failure-simulator-sam-dev
      RetentionInDays: 7

Outputs:
  IncidentsTableName:
    Description: DynamoDB table used for incident records.
    Value: !Ref IncidentsTable

  CreateIncidentFunctionName:
    Description: Lambda function for creating incidents.
    Value: !Ref CreateIncidentFunction

  GetIncidentFunctionName:
    Description: Lambda function for getting one incident.
    Value: !Ref GetIncidentFunction

  ListIncidentsFunctionName:
    Description: Lambda function for listing incidents.
    Value: !Ref ListIncidentsFunction

  UpdateIncidentFunctionName:
    Description: Lambda function for updating incidents.
    Value: !Ref UpdateIncidentFunction

  AlarmToIncidentFunctionName:
    Description: Lambda function for converting alarm events into incidents.
    Value: !Ref AlarmToIncidentFunction

  EscalateIncidentsFunctionName:
    Description: Lambda function for escalating stale open incidents.
    Value: !Ref EscalateIncidentsFunction

  FailureSimulatorFunctionName:
    Description: Lambda function that intentionally fails for alarm validation.
    Value: !Ref FailureSimulatorFunction

  FailureSimulatorAlarmName:
    Description: CloudWatch alarm for failure simulator Lambda errors.
    Value: !Ref FailureSimulatorErrorAlarm

  FailureSimulatorAlarmRuleName:
    Description: EventBridge rule that routes failure simulator alarm events.
    Value: !Ref FailureSimulatorAlarmStateRule
